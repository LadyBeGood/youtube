<!doctype html>
<html lang="en" class="bg-black no-scrollbar">

<head>
    <!-- Primary meta tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Youtube clone</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./youtube-app-icon.webp" />

    <!-- Roboto font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Status bar style for Apple devices -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />

    <!-- Web app manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- Main CSS file -->
    <link rel="stylesheet" href="./index.css" />
</head>

<body class="bg-black h-svh no-scrollbar font-[Roboto]" tabindex="-1"> <!-- Disable Google Chrome's "Tap to search" feature on mobile (https://stackoverflow.com/a/64619907) -->
    <!-- Root element for the React app -->
    <div id="root" class="text-white h-svh relative no-scrollbar bg-black grid grid-rows-[auto_1fr_auto]">
        <!-- Loading spinner -->
        <div class="grid place-items-center h-svh w-vw">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Main JavaScript file -->
    <script type="module" src="./src/App.tsx"></script>
</body>

</html>
