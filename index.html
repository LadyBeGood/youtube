<!doctype html>
<html lang="en" class="bg-black no-scrollbar">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./youtube-app-icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Youtube clone</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./index.css" />
</head>

<!-- Disable Google Chrome's "Tap to search" feature on mobile (https://stackoverflow.com/a/64619907) -->
<body class="bg-black min-h-lvh no-scrollbar" tabindex="-1">
    <div id="root" class="text-white h-svh relative no-scrollbar bg-black grid grid-rows-[auto_1fr_auto]"></div>
    
    <script type="module" src="./src/App.tsx"></script>
    <script>
        // After checking whether the client's browser supports the Service Worker API, register the service worker
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", async () => {
                try {
                    const reg = await navigator.serviceWorker.register("./service-worker.js");
                    console.log("Service Worker registered");
                } catch (err) {
                    console.error("Service Worker registration failed: ", err);
                }
            });
        }
    </script>
</body>

</html>
