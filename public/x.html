<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GSAP Hover & Move Demo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle {
            width: 100px;
            height: 100px;
            background: #38bdf8;
            border-radius: 50%;
            position: absolute;
        }
    </style>
</head>

<body>
    <div class="circle"></div>
    <script>
        const circle = document.querySelector(".circle");

        document.addEventListener("mousemove", e => {
            gsap.to(circle, {
                x: e.clientX,
                y: e.clientY,
                duration: 0.3,
                ease: "power2.out"
            });
        });

        circle.addEventListener("mouseenter", () => {
            gsap.to(circle, { scale: 1.5, backgroundColor: "#f472b6", duration: 0.2 });
        });

        circle.addEventListener("mouseleave", () => {
            gsap.to(circle, { scale: 1, backgroundColor: "#38bdf8", duration: 0.2 });
        });
    </script>
</body>

</html>
